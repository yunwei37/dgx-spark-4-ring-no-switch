name: Build INT4/Int8Mix vLLM runtime and router candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reclaim unused ephemeral runner tool caches
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the INT4/Int8Mix runtime
        id: base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:int4-int8mix-20260824
            ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:int4-int8mix-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Build and publish the GLM-5.3 IntMix router candidate
        id: router
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.vllm-glm53-intmix
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:glm53-intmix-router-${{ github.sha }}
          build-args: |
            RUNTIME_IMAGE=ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:int4-int8mix-20260824
          provenance: mode=max
          sbom: true
      - name: Record published digests
        run: |
          echo "image=ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:int4-int8mix-${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "digest=${{ steps.base.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "image=ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:glm53-intmix-router-${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "digest=${{ steps.router.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
