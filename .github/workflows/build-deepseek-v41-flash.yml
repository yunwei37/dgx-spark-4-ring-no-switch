name: Build DeepSeek-V4.1-Flash runtime

on:
  workflow_dispatch:
    inputs:
      qualified_release:
        description: 'Publish an already-qualified OCI release; empty keeps the legacy build'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reclaim unused ephemeral runner tool caches
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Add build swap for the large FlashInfer JIT compilations
        if: inputs.qualified_release == ''
        # The mxfp8/sparse-MLA CUTLASS compilations can exceed the 16 GiB
        # runner RAM; the recipe itself documented them wedging memory on
        # real nodes. Swap keeps the runner alive without changing the image.
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 48G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: inputs.qualified_release == ''
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable ARM64 image
        if: inputs.qualified_release == ''
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.deepseek-v41-flash
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:deepseek-v41-flash-20260911
            ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:deepseek-v41-flash-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record published digest
        if: inputs.qualified_release == ''
        run: |
          echo "image=ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:deepseek-v41-flash-${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "digest=${{ steps.build.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish the exact qualified SGLang and NCCL images
        if: inputs.qualified_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RELEASE: ${{ inputs.qualified_release }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          assets="$RUNNER_TEMP/qualified-artifacts"
          layout="$RUNNER_TEMP/qualified-oci"
          mkdir -p "$assets"
          gh release download "$QUALIFIED_RELEASE" -R "$GITHUB_REPOSITORY" --dir "$assets"             --pattern sglang-native-production-overlay.oci.tar             --pattern nccl-mesh-runtime-20261030.oci.tar
          skopeo copy --preserve-digests             docker://lmsysorg/sglang@sha256:b4a4745fab5393dc0aca573fe754b86477f57691c9e971390b21102d3d94ebf9             "oci:$layout:base"
          tar -xf "$assets/sglang-native-production-overlay.oci.tar" -C "$layout"
          authfile="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          image=ghcr.io/yunwei37/dgx-spark-4-ring-no-switch
          skopeo copy --preserve-digests --dest-authfile "$authfile"             "oci:$layout:cfe3cfb-production-20261030c"             "docker://$image:sglang-cfe3cfb-production-20261030c"
          skopeo copy --preserve-digests --dest-authfile "$authfile"             "oci-archive:$assets/nccl-mesh-runtime-20261030.oci.tar"             "docker://$image:nccl-2.29.7-mesh-19924dcc"
          skopeo inspect --format '{{.Digest}}'             "docker://$image:sglang-cfe3cfb-production-20261030c" >> "$GITHUB_STEP_SUMMARY"
          skopeo inspect --format '{{.Digest}}'             "docker://$image:nccl-2.29.7-mesh-19924dcc" >> "$GITHUB_STEP_SUMMARY"
