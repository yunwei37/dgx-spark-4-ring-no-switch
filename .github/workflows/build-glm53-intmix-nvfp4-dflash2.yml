name: Build GLM-5.3 IntMix NVFP4 DFlash2 runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable ARM64 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.vllm-glm53-intmix-nvfp4-dflash2
          platforms: linux/arm64
          push: true
          tags: ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:glm53-intmix-nvfp4-dflash2-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record published digest
        run: |
          echo "image=ghcr.io/yunwei37/dgx-spark-4-ring-no-switch:glm53-intmix-nvfp4-dflash2-${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "digest=${{ steps.build.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
