<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Native eight-thread mmap versus pread: measured GPU-copy diagnostic</title>
<desc id="desc">ABBA runs copied the same 7594 tensors. Sampled RSS was 5.79,15.04,13.79,5.78 GiB. Time was 231.01,8.20,8.16,92.23 seconds. Faster pread used more memory. Cache uncontrolled, no full-model speedup claim.</desc>
<rect width="900" height="440" fill="#fff"/>
<g font-family="sans-serif" fill="#18232c">
<text x="24" y="32" font-size="21">Native pread: much faster copy loop, higher memory peak</text>
<text x="24" y="57" font-size="13">First ten shards · 7,594 tensors · same edge digest · no model constructed</text>
<text x="170" y="94" font-size="14">Sampled process RSS (GiB)</text>
<text x="582" y="94" font-size="14">Diagnostic elapsed (seconds)</text>
<text x="24" y="134" font-size="14">1. mmap</text><rect x="170" y="117" width="133.10" height="24" fill="#4367b2"/><text x="311.10395431518555" y="134" font-size="13">5.79</text><rect x="582" y="117" width="226.39" height="24" fill="#4367b2"/><text x="816.3918207119781" y="134" font-size="13">231.01</text>
<text x="24" y="192" font-size="14">2. pread</text><rect x="170" y="175" width="346.02" height="24" fill="#bc7029"/><text x="524.0239028930664" y="192" font-size="13">15.04</text><rect x="582" y="175" width="8.04" height="24" fill="#bc7029"/><text x="598.0384657515373" y="192" font-size="13">8.20</text>
<text x="24" y="250" font-size="14">3. pread</text><rect x="170" y="233" width="317.11" height="24" fill="#bc7029"/><text x="495.1072883605957" y="250" font-size="13">13.79</text><rect x="582" y="233" width="8.00" height="24" fill="#bc7029"/><text x="597.9974806207833" y="250" font-size="13">8.16</text>
<text x="24" y="308" font-size="14">4. mmap</text><rect x="170" y="291" width="132.93" height="24" fill="#4367b2"/><text x="310.93102264404297" y="308" font-size="13">5.78</text><rect x="582" y="291" width="90.39" height="24" fill="#4367b2"/><text x="680.3859989652265" y="308" font-size="13">92.23</text>
<text x="24" y="374" font-size="13">CUDA peak 1.77 GiB for every run; do not sum overlapping memory counters.</text>
<text x="24" y="398" font-size="13">Cache/IO uncontrolled. Timings include synchronized copies and checks, not full-model startup.</text>
<text x="24" y="422" font-size="13">No native8threads+pread setting retained. Formal GLM-5.3 inference remains unproven.</text>
</g></svg>

