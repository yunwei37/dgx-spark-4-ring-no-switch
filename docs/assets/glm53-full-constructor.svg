<svg xmlns="http://www.w3.org/2000/svg" width="840" height="325" viewBox="0 0 840 325" role="img" aria-labelledby="title desc">
<title id="title">Complete NVFP4 constructor memory; subsequent loading failed</title>
<desc id="desc">Four measured PP stages used 102 to 106 GiB of Torch memory. Host memory available after construction was only 4 to 6 GiB. Subsequent loading exhausted reserve and caused a node outage. No inference succeeded.</desc>
<rect width="840" height="325" fill="#fff"/>
<g font-family="sans-serif" fill="#15263b"><text x="28" y="29" font-size="18" font-weight="bold">Formal NVFP4: complete constructor, unsafe subsequent load</text><text x="28" y="52" font-size="12">2026-08-31 · native PP4 · full 78 layers · measured GiB, not inference throughput</text>
<text x="110" y="84" font-size="12">Torch allocated (0–120 GiB)</text><text x="565" y="84" font-size="12">Host available (0–12 GiB)</text>
<text x="28" y="119" font-size="13">Stage 0</text><rect x="110" y="104" width="370" height="22" fill="#edf1f7"/><rect x="110" y="104" width="315.67" height="22" fill="#3165bd"/><text x="488" y="119" font-size="12">102.38</text><rect x="565" y="104" width="200" height="22" fill="#edf1f7"/><rect x="565" y="104" width="102.84" height="22" fill="#d17b24"/><text x="773" y="119" font-size="12">6.17</text>
<text x="28" y="159" font-size="13">Stage 1</text><rect x="110" y="144" width="370" height="22" fill="#edf1f7"/><rect x="110" y="144" width="320.13" height="22" fill="#3165bd"/><text x="488" y="159" font-size="12">103.83</text><rect x="565" y="144" width="200" height="22" fill="#edf1f7"/><rect x="565" y="144" width="99.94" height="22" fill="#d17b24"/><text x="773" y="159" font-size="12">6.00</text>
<text x="28" y="199" font-size="13">Stage 2</text><rect x="110" y="184" width="370" height="22" fill="#edf1f7"/><rect x="110" y="184" width="320.13" height="22" fill="#3165bd"/><text x="488" y="199" font-size="12">103.83</text><rect x="565" y="184" width="200" height="22" fill="#edf1f7"/><rect x="565" y="184" width="105.17" height="22" fill="#d17b24"/><text x="773" y="199" font-size="12">6.31</text>
<text x="28" y="239" font-size="13">Stage 3</text><rect x="110" y="224" width="370" height="22" fill="#edf1f7"/><rect x="110" y="224" width="325.54" height="22" fill="#3165bd"/><text x="488" y="239" font-size="12">105.58</text><rect x="565" y="224" width="200" height="22" fill="#edf1f7"/><rect x="565" y="224" width="68.26" height="22" fill="#d17b24"/><text x="773" y="239" font-size="12">4.10</text>
<text x="28" y="288" font-size="13" fill="#a02121">Loading then breached reserve; one node lost SSH/Lease. Successful requests: 0.</text><text x="28" y="309" font-size="11">Initial Torch cap excludes CPU and driver memory. These constructor samples do not prove safe serving capacity.</text></g></svg>
