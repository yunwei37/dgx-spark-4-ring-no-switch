ill="#2563eb"/><rect x="215" y="293" width="310.4" height="10" fill="#d97706"/><text x="675" y="290" font-size="12">0.585 / 1.773</text><text x="25" y="328" font-size="12">device_cache_released</text><rect x="215" y="316" width="102.4" height="12" fill="#2563eb"/><rect x="215" y="331" width="0.0" height="10" fill="#d97706"/><text x="675" y="328" font-size="12">0.585 / 0.000</text><rect x="25" y="370" width="15" height="10" fill="#2563eb"/><text x="46" y="380" font-size="12">Process RSS</text><rect x="170" y="370" width="15" height="10" fill="#d97706"/><text x="191" y="380" font-size="12">CUDA allocation</text><text x="500" y="380" font-size="12">2026-08-31 16:01 UTC · default native path</text></g></svg>
